name: Actualizar valores de fondos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Diagnostico
        run: |
          python - <<'PY'
          import requests

          url = "https://www.finect.com/fondos-inversion/LU1404935469-Ab_select_us_equity_w_eur"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36"
          }
          r = requests.get(url, headers=headers, timeout=30)
          print("STATUS:", r.status_code)
          print("LENGTH:", len(r.text))
          print("---INICIO---")
          print(r.text[:2000])
          print("---FIN---")
          PY
